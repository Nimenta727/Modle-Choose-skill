name: tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q skills/model-router/scripts tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline policy evaluation
        run: |
          python tools/evals/evaluate_routes.py \
            --json-out "${{ runner.temp }}/routing-eval.json" \
            --md-out "${{ runner.temp }}/routing-eval.md"
      - name: CLI dry-run smoke (no model calls)
        run: |
          python tools/evals/live_triggers.py --agent claude --max-runs 5
          python tools/evals/live_triggers.py --agent codex --max-runs 5
      - name: V1.4 evidence and handoff smoke (no model calls)
        run: |
          python tools/evals/score_trials.py --trials tools/evals/trials.json --output "${{ runner.temp }}/trial-score.json"
          python tools/evals/compare_trials.py --trials tools/evals/trials.json --json-out "${{ runner.temp }}/paired-proposal.json"
          python skills/model-router/scripts/route.py \
            --task-file skills/model-router/examples/budget-plan.json \
            --format json > "${{ runner.temp }}/budget-reference.json"
          python skills/model-router/scripts/handoff.py \
            --task-file skills/model-router/examples/project-plan.json \
            > "${{ runner.temp }}/handoff-templates.md"
      - name: V2.0 execution adapter dry-run (no provider calls)
        run: |
          python skills/model-router/scripts/route.py --task-file skills/model-router/examples/project-plan.json --format json > "${{ runner.temp }}/route-v2.json"
          python tools/orchestrator/prepare.py --task-file skills/model-router/examples/project-plan.json --route-file "${{ runner.temp }}/route-v2.json" --output "${{ runner.temp }}/unapproved-v2.json"
          python tools/orchestrator/run.py --manifest "${{ runner.temp }}/unapproved-v2.json" --workspace . --all
      - name: V2.2 checkpoint smoke (no model calls)
        run: |
          python tools/orchestrator/checkpoints.py --manifest "${{ runner.temp }}/unapproved-v2.json" --state "${{ runner.temp }}/checkpoint-v22.json" --init
          python tools/orchestrator/checkpoints.py --manifest "${{ runner.temp }}/unapproved-v2.json" --state "${{ runner.temp }}/checkpoint-v22.json" --status > "${{ runner.temp }}/checkpoint-status.json"
      - name: Token-efficient plan and budget dry-run (no provider calls)
        run: |
          python skills/model-router/scripts/route.py --task-file skills/model-router/examples/token-efficient-plan.json --format json > "${{ runner.temp }}/token-route.json"
          python tools/orchestrator/prepare.py --task-file skills/model-router/examples/token-efficient-plan.json --route-file "${{ runner.temp }}/token-route.json" --output "${{ runner.temp }}/token-execution.json"
          python tools/orchestrator/run.py --manifest "${{ runner.temp }}/token-execution.json" --workspace . --all
      - name: Upload offline eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-router-offline-eval
          path: |
            ${{ runner.temp }}/routing-eval.json
            ${{ runner.temp }}/routing-eval.md
            ${{ runner.temp }}/trial-score.json
            ${{ runner.temp }}/paired-proposal.json
            ${{ runner.temp }}/budget-reference.json
            ${{ runner.temp }}/handoff-templates.md
          if-no-files-found: warn
