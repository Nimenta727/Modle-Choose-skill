name: tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q skills/model-router/scripts scripts evals
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline policy evaluation
        run: |
          python evals/evaluate_routes.py \
            --json-out "${{ runner.temp }}/routing-eval.json" \
            --md-out "${{ runner.temp }}/routing-eval.md"
      - name: CLI dry-run smoke (no model calls)
        run: |
          python evals/live_triggers.py --agent claude --max-runs 5
          python evals/live_triggers.py --agent codex --max-runs 5
      - name: V1.4 evidence and handoff smoke (no model calls)
        run: |
          python evals/score_trials.py --trials evals/trials.json --output "${{ runner.temp }}/trial-score.json"
          python evals/compare_trials.py --trials evals/trials.json --json-out "${{ runner.temp }}/paired-proposal.json"
          python skills/model-router/scripts/route.py \
            --task-file skills/model-router/examples/budget-plan.json \
            --format json > "${{ runner.temp }}/budget-reference.json"
          python skills/model-router/scripts/handoff.py \
            --task-file skills/model-router/examples/project-plan.json \
            > "${{ runner.temp }}/handoff-templates.md"
      - name: Upload offline eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-router-offline-eval
          path: |
            ${{ runner.temp }}/routing-eval.json
            ${{ runner.temp }}/routing-eval.md
            ${{ runner.temp }}/trial-score.json
            ${{ runner.temp }}/paired-proposal.json
            ${{ runner.temp }}/budget-reference.json
            ${{ runner.temp }}/handoff-templates.md
          if-no-files-found: warn
